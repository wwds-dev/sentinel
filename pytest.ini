[pytest]
testpaths = tests agents/sentry/tests
# Sentry's tests import its package as `sentry`; that was agents/sentry/conftest.py,
# whose module name `conftest` collided with tests/conftest.py in one run.
pythonpath = agents/sentry
# Slow checks run on request only: `pytest -m slow` (a later -m overrides this one).
addopts = -m "not slow"

markers =
    allow_network: the test may connect to hosts other than loopback
    allow_process: the test may start real programs
    slow: long-running check, run at Verify and Release with -m slow
