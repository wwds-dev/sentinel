name: diag-macos
on:
  push:
    branches: [diag/macos-abort]
jobs:
  pytest:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pytest-cov
      - name: Test
        run: |
          set +e
          PYTHONUNBUFFERED=1 python -X faulthandler -m pytest -p no:cacheprovider -q --cov --cov-report=term-missing:skip-covered > out.txt 2>&1
          code=$?
          grep -n -B 14 -A 6 -m 1 "Fatal Python error\|Current thread\|Aborted" out.txt | cut -c1-200 | head -c 3500 | python3 -c "import sys; t=sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A'); print('::error title=pytest tail (exit $code)::'+t)"
          exit $code
