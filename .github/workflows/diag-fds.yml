name: diag-fds
on:
  push:
    branches: [diag/fds]
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        mode: [one]
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pytest-cov
      - name: Test
        run: |
          set +e
          PYTHONUNBUFFERED=1 python -X faulthandler -m pytest -p no:cacheprovider -v --cov --cov-report= > out.txt 2>&1
          code=$?
          { echo "exit=$code"; grep -n -m 1 -B 4 -A 2 "FAILED\|ERROR" out.txt | cut -c1-170; echo ----; grep -n -B 6 -m 1 "Fatal Python" out.txt | cut -c1-170; } | head -c 3600 | python3 -c "import sys; t=sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A'); print('::error title=result::'+t)"
          exit $code
