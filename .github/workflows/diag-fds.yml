name: diag-fds
on:
  push:
    branches: [diag/fds]
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        mode: [cov, nocov]
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pytest-cov
      - name: Test
        run: |
          set +e
          if [ "${{ matrix.mode }}" = cov ]; then COV="--cov --cov-report="; else COV=""; fi
          PYTHONUNBUFFERED=1 python -X faulthandler -m pytest -p no:cacheprovider -q --tb=short tests/test_contract_tunnel_chat.py $COV > out.txt 2>&1
          code=$?
          { echo "mode=${{ matrix.mode }} exit=$code"; tail -n 3 out.txt | cut -c1-170; echo ----; grep -n -m 1 -A 28 "^____" out.txt | cut -c1-170; } | head -c 3700 | python3 -c "import sys; t=sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A'); print('::error title=result::'+t)"
          exit $code
